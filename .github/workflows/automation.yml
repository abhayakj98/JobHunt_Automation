name: Scheduled Automation

on:
  schedule:
    # Runs at 03:00 IST (21:30 UTC) every day
    - cron: '30 21 * * *'
  workflow_dispatch: # Allows you to run it manually

jobs:
  automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Job Automation
        env:
          GEMINI_API_KEY: "AIzaSyCO3WxsmYiAMDWxUtCE_r8eM9FK8fKSQV8"
        run: node generate-jobs-excel.mjs
          # Change this to whatever command runs your main daily job hunt automation
          # For example: node daily-routine.mjs or npm run scan
        
