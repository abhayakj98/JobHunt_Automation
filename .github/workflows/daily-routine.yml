name: Daily Job Search Routine

on:
  schedule:
    - cron: '30 2 * * *' # 8:00 AM IST (2:30 AM UTC)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  run-routine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Daily Routine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node daily-routine.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ output/
          git commit -m "Auto-update: Daily job search results [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
